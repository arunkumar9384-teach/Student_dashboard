<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <h2><i class="fa-solid fa-user-graduate"></i> StudentMS</h2>

        <ul>
            <li class="active">
                <a href="index.html">
                    <i class="fa-solid fa-table-columns"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="add-student.html">
                    <i class="fa-solid fa-user-plus"></i>
                    Add Student
                </a>
            </li>
        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Header -->

        <header>

            <h1>Dashboard</h1>

            <a href="add-student.html" class="add-btn">
                <i class="fa-solid fa-plus"></i>
                Add Student
            </a>

        </header>

        <!-- Statistics -->

        <div class="cards">

            <div class="card">
                <i class="fa-solid fa-users"></i>
                <h2 id="totalStudents">0</h2>
                <p>Total Students</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-mars"></i>
                <h2 id="maleCount">0</h2>
                <p>Male Students</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-venus"></i>
                <h2 id="femaleCount">0</h2>
                <p>Female Students</p>
            </div>

        </div>

        <!-- Search -->

        <div class="search-box">

            <input type="text"
                id="search"
                placeholder="Search Student..."
                onkeyup="searchStudent()">

        </div>

        <!-- Student Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
